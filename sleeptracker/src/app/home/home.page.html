<ion-content [fullscreen]="true">
  <ion-header [translucent]="true">
    <ion-toolbar>
      <div class="app-title">SleepO</div>
    </ion-toolbar>
  </ion-header>

  <div class="ion-padding">
    @if(nameSaved()) {
      <div class="name-row">
        <h2><strong>Good morning, {{name}}!</strong></h2>
        <ion-button size="small" (click)="clearData()">
            Reset Name
          </ion-button>
      </div>
      
    }
    @else {
      <div class="name-row">
        <ion-input [(ngModel)]="name" placeholder="Enter your name"></ion-input>
        <ion-button size="small" (click)="saveName()">
          Save Name
        </ion-button>
      </div>
    }
    <ion-grid>
      <ion-row>
        <ion-col size="12">
          <ion-card
            class="compact-card"
            button="true"
            routerLink="/overnight-sleep"
          >
            <img
              class="card-image"
              src="assets/images/overnight-sleep.png"
              alt="Animation of person sleeping in bed"
            />
            <ion-card-header>
              <ion-card-title>Overnight Sleep</ion-card-title>
              <ion-card-subtitle>Log your sleep hours.</ion-card-subtitle>
            </ion-card-header>
          </ion-card>
        </ion-col>

        <ion-col size="12">
          <ion-card
            class="compact-card"
            button="true"
            routerLink="/daytime-sleepiness"
          >
            <img
              class="card-image"
              src="assets/images/sleepiness.png"
              alt="Animation of person falling asleep at his desk"
            />
            <ion-card-header>
              <ion-card-title>Sleepiness</ion-card-title>
              <ion-card-subtitle
                >Rate your sleepiness during the day.</ion-card-subtitle
              >
            </ion-card-header>
          </ion-card>
        </ion-col>
      </ion-row>

      <ion-row>
        <ion-col size="12">
          <ion-card class="compact-card" button="true" routerLink="/history">
            <img
              class="card-image"
              src="assets/images/history.png"
              alt="Animation of a clock and a person falling alseep on it"
            />
            <ion-card-header>
              <ion-card-title>Your History</ion-card-title>
              <ion-card-subtitle
                >View and edit your sleep activity.</ion-card-subtitle
              >
            </ion-card-header>
          </ion-card>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
