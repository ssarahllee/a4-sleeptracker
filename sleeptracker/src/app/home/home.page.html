<ion-content [fullscreen]="true">
  <ion-header [translucent]="true">
    <ion-toolbar>
      <ion-title>App Name Here?</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="ion-padding">
    <!-- @if(nameSaved())
    <h2>Good morning/night, {{name}}!</h2>
    @else {

    } -->
    <ion-grid>
      <ion-row>
        <ion-col size="12">
          <ion-card
            class="compact-card"
            button="true"
            routerLink="/overnight-sleep"
          >
            <img
              alt="Silhouette of mountains"
              src="https://ionicframework.com/docs/img/demos/card-media.png"
            />
            <ion-card-header>
              <ion-card-title>Overnight Sleep</ion-card-title>
              <ion-card-subtitle>Log your sleep hours.</ion-card-subtitle>
            </ion-card-header>
          </ion-card>
        </ion-col>

        <ion-col size="12">
          <ion-card class="compact-card" button="true" routerLink="/daytime-sleepiness">
            <img
              alt="Silhouette of mountains"
              src="https://ionicframework.com/docs/img/demos/card-media.png"
            />
            <ion-card-header>
              <ion-card-title>Sleepiness</ion-card-title>
              <ion-card-subtitle
                >Rate your sleepiness during the day.</ion-card-subtitle
              >
            </ion-card-header>
          </ion-card>
        </ion-col>
      </ion-row>

      <ion-row>
        <ion-col size="12">
          <ion-card class="compact-card" button="true" routerLink="/history">
            <img
              alt="Silhouette of mountains"
              src="https://ionicframework.com/docs/img/demos/card-media.png"
            />
            <ion-card-header>
              <ion-card-title>Sleep History</ion-card-title>
              <ion-card-subtitle
                >View and edit your sleep activity.</ion-card-subtitle
              >
            </ion-card-header>
          </ion-card>
        </ion-col>
      </ion-row>

    </ion-grid>

  </div>

</ion-content>
