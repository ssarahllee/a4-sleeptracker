<ion-content [fullscreen]="true">
  <ion-header [translucent]="true">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-back-button defaultHref="/home"></ion-back-button>
      </ion-buttons>
      <div class="app-title">SleepO</div>
    </ion-toolbar>
  </ion-header>

  <div class="ion-padding">
    <h2><strong>Log Your Overnight Sleep</strong></h2>
    <p>Enter when you went to bed and when you woke up.</p>

    <!-- bedtime -->
    <ion-item class="bedtime-section" lines="none">
      <ion-label class="time-label" position="stacked">Bedtime</ion-label>
      <input 
      type="datetime-local"
      [(ngModel)]="bedtime"
      aria-label="Bedtime"
      />
    </ion-item>

    <!-- wake up time -->
    <ion-item lines="none">
      <ion-label class="time-label" position="stacked">Wake-Up Time</ion-label>
      <input
        type="datetime-local"
        [(ngModel)]="wakeUpTime"
        aria-label="Wake-Up Time"
      />
    </ion-item>

    <!-- save button -->
    <div class="save-button-container">
      <!-- <ion-button size="medium" (click)="saveSleep()">
        Save Sleep Log
      </ion-button> -->

      @if (!showUndo) {
        <ion-button size="medium" (click)="saveSleep()">
          Save Sleep Log
        </ion-button>
      }
      @else {
        <ion-button size="medium" (click)="undoLastEntry()">
          Undo Log
        </ion-button>
      }
    </div>

    <!-- feedback popup -->
    @if (message) {
    <p>{{ message }}</p>
    }
  </div>
</ion-content>
