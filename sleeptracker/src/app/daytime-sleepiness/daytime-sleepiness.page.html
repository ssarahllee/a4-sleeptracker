<ion-content [fullscreen]="true">
  <ion-header [translucent]="true">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-back-button defaultHref="/home"></ion-back-button>
      </ion-buttons>
      <ion-title>App Name Here?</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="ion-padding">
    <h2><strong>Sleepiness</strong></h2>
    <p>Rate your daytime sleepiness.</p>

    <!-- log time of sleepiness -->
    <ion-item>
      <ion-label position="stacked">Use Current Time</ion-label>
      <ion-toggle [(ngModel)]="useCurrentTime"></ion-toggle>
    </ion-item>

    <ion-item *ngIf="!useCurrentTime">
      <ion-label position="stacked">Custom Time</ion-label>
      <ion-datetime
        presentation="date-time"
        [(ngModel)]="selectedTime">
      </ion-datetime>
    </ion-item>

    <ion-item *ngIf="useCurrentTime">
      <ion-label>
        Current Time: {{ currentTime | date:'short' }}
      </ion-label>
    </ion-item>

      <!-- save time and date -->
    <div class="save-button-container">
      <ion-button size="medium" (click)="saveEntry()">
        Save Time and Date
      </ion-button>
    </div>

    <!-- log rating of sleepiness -->
    <ion-radio-group [(ngModel)]="sleepinessLevel">
        <ion-radio *ngFor="let option of sleepinessOptions" labelPlacement="end" justify="start" [value]="option.level" class="sleepiness-radio">
          {{ option.level }} - {{ option.description }}
      </ion-radio>
    </ion-radio-group>

  <!-- leave additional comment about sleepiness -->

  <!-- save sleepiness -->
    <div class="save-button-container">
      <ion-button size="medium" (click)="saveEntry()">
        Save Sleepiness Rating
      </ion-button>
    </div>

  </div>


</ion-content>
