<ion-content [fullscreen]="true">
  <ion-header [translucent]="true">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-back-button defaultHref="/home"></ion-back-button>
      </ion-buttons>
      <div class="app-title">SleepO</div>
    </ion-toolbar>
  </ion-header>

  <div class="ion-padding">
    <h2><strong>Sleepiness</strong></h2>

    <!-- log time of sleepiness -->
    <ion-item>
      <ion-label class="time-label" position="stacked"
        >Use Current Time</ion-label
      >
      <ion-toggle [(ngModel)]="useCurrentTime"></ion-toggle>
    </ion-item>

    <ion-item *ngIf="!useCurrentTime">
      <ion-label class="time-label" position="stacked">Custom Time</ion-label>
      <ion-datetime presentation="date-time" [(ngModel)]="selectedTime">
      </ion-datetime>
    </ion-item>

    <ion-item *ngIf="useCurrentTime">
      <ion-label class="time-label">
        Current Time: {{ currentTime | date:'short' }}
      </ion-label>
    </ion-item>

    <div class="spacer"></div>

    <p>Rate your daytime sleepiness below.</p>
    <!-- log rating of sleepiness -->
    <div class="wheel-container">
      <div
        *ngFor="let option of sleepinessOptions"
        #wheelItem
        class="wheel-item"
        [class.selected]="sleepinessLevel === option.level"
        (click)="selectSleepiness(option.level, wheelItem)"
      >
        <div class="level">{{ option.level }}</div>
        <div class="description">{{ option.description }}</div>
      </div>
    </div>

    <!-- leave additional comment about sleepiness -->

    <!-- save sleepiness -->
    <div class="save-button-container">
      <ion-button size="medium" (click)="saveEntry()">
        Save Sleepiness Rating
      </ion-button>
    </div>

    <!-- feedback popup -->
    @if (message) {
    <p>{{ message }}</p>
    }
  </div>
</ion-content>
