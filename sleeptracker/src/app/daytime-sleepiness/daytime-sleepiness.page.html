<ion-content [fullscreen]="true">
  <ion-header [translucent]="true">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-back-button defaultHref="/home"></ion-back-button>
      </ion-buttons>
      <ion-title>App Name Here?</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="ion-padding">
    <h2>Sleepiness</h2>
    <p>Rate your daytime sleepiness.</p>

    <ion-list>
    <ion-radio-group [(ngModel)]="sleepinessLevel">
      <ion-item *ngFor="let option of sleepinessOptions">
        <ion-label>
          {{ option.level }} - {{ option.description }}
        </ion-label>
        <ion-radio slot="start" [value]="option.level" class="filled-radio" mode="md"></ion-radio>
      </ion-item>
    </ion-radio-group>
  </ion-list>
  </div>


</ion-content>
